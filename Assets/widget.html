<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>CloClo</title>
<style>
  :root{
    --body1:#6b2b26; --body2:#3c1512; --metal1:#e6c476; --metal2:#c9a24b; --metal3:#8a6a2f;
    --face:#ede3ce; --ink:#241e1a; --highlight:#f3d78b; --sweater:#b0483d;
  }
  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    font-family:'Segoe UI', sans-serif;
  }
  #stage{
    width:150px; height:210px; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:grab;
  }
  #stage:active{ cursor:grabbing; }
  #sparkle{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #keeperWrap{ animation:breathe 3.2s ease-in-out infinite; transform-origin:50% 100%; }
  @keyframes breathe{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }

  #info{ text-align:center; color:var(--face); margin-top:2px; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55); }
  #temp{ font-size:19px; font-weight:800; line-height:1; }
  #place{ font-size:10px; opacity:.9; letter-spacing:.02em; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Sun rays, shown behind the keeper on clear days. */
  .sun{ position:absolute; top:14px; right:10px; width:26px; height:26px; display:none; }
  body.sky-clear .sun{ display:block; }
  .sun .core{ position:absolute; left:8px; top:8px; width:10px; height:10px; border-radius:50%; background:var(--highlight); box-shadow:0 0 10px 2px var(--highlight); }
  .sun .ray{ position:absolute; left:12px; top:12px; width:2px; height:6px; background:var(--highlight); border-radius:1px; transform-origin:1px 13px; opacity:.85; }

  /* A drifting cloud, shown instead of the sun on overcast days. */
  .cloud{ position:absolute; top:16px; right:6px; width:46px; height:22px; display:none; animation:drift 6s ease-in-out infinite; }
  body.sky-cloudy .cloud{ display:block; }
  .cloud .puff{ position:absolute; bottom:5px; border-radius:50%; background:#dfe6ee; opacity:.92; }
  .cloud .puff1{ left:0; width:16px; height:16px; }
  .cloud .puff2{ left:12px; bottom:8px; width:20px; height:20px; }
  .cloud .puff3{ left:28px; width:14px; height:14px; }
  .cloud .base{ position:absolute; left:4px; bottom:0; width:38px; height:14px; border-radius:8px; background:#dfe6ee; opacity:.92; }
  @keyframes drift{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-4px); } }

  /* A few falling streaks/dots — a light touch of the app's own weather layer. */
  .drop{ position:absolute; width:2px; height:12px; border-radius:1px; background:#cfe3f7; opacity:0; top:-14px; }
  body.sky-rain .drop, body.sky-storm .drop{ opacity:.75; animation:fall linear infinite; }
  .flake{ position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; opacity:0; top:-8px; }
  body.sky-snow .flake{ opacity:.85; animation:fallSlow linear infinite; }
  @keyframes fall{ 0%{ transform:translateY(-14px); } 100%{ transform:translateY(214px); } }
  @keyframes fallSlow{ 0%{ transform:translate(0,-8px); } 50%{ transform:translate(6px,100px); } 100%{ transform:translate(-4px,214px); } }

  body.sky-storm #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  body.sky-storm #flash.on{ animation:flash .5s ease-out; }
  @keyframes flash{ 0%{ opacity:.55; } 100%{ opacity:0; } }
</style>
</head>
<body>
  <div id="stage">
    <div id="sparkle">
      <div id="flash"></div>
      <div class="sun"><div class="core"></div></div>
      <div class="cloud"><div class="puff puff1"></div><div class="puff puff2"></div><div class="puff puff3"></div><div class="base"></div></div>
      <div class="drop" style="left:8px; animation-duration:.9s; animation-delay:0s;"></div>
      <div class="drop" style="left:26px; animation-duration:1.1s; animation-delay:.3s;"></div>
      <div class="drop" style="left:112px; animation-duration:.8s; animation-delay:.15s;"></div>
      <div class="drop" style="left:132px; animation-duration:1s; animation-delay:.5s;"></div>
      <div class="flake" style="left:14px; animation-duration:5s; animation-delay:0s;"></div>
      <div class="flake" style="left:40px; animation-duration:6.5s; animation-delay:1.2s;"></div>
      <div class="flake" style="left:100px; animation-duration:5.8s; animation-delay:.6s;"></div>
      <div class="flake" style="left:126px; animation-duration:7s; animation-delay:2s;"></div>
    </div>

    <div id="keeperWrap">
      <svg width="108" height="145" viewBox="0 0 100 140">
        <ellipse cx="50" cy="134" rx="22" ry="4" fill="#000" opacity="0.22" />

        <g id="umbrellaLeaning" style="display:none">
          <line x1="91" y1="84" x2="91" y2="90" stroke="var(--metal3)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M91 88 L86 118 L96 118 Z" fill="var(--body1)" stroke="var(--metal3)" stroke-width="0.7" />
          <line x1="91" y1="118" x2="90" y2="130" stroke="var(--metal3)" stroke-width="1.6" stroke-linecap="round" />
          <path d="M90 130 q0 4 -4 4" stroke="var(--metal3)" stroke-width="1.6" fill="none" stroke-linecap="round" />
        </g>

        <rect x="40.5" y="104" width="8.5" height="25" rx="4" fill="#46506a" />
        <rect x="51" y="104" width="8.5" height="25" rx="4" fill="#46506a" />
        <ellipse cx="44.5" cy="130" rx="6.5" ry="3.8" fill="#2a2320" />
        <ellipse cx="55.5" cy="130" rx="6.5" ry="3.8" fill="#2a2320" />

        <g id="torsoDefault">
          <path d="M31 106 Q29 78 50 73 Q71 78 69 106 Z" fill="var(--sweater)" />
          <path d="M43 74 q7 6 14 0" stroke="var(--metal3)" stroke-width="1.2" fill="none" stroke-linecap="round" />
        </g>
        <g id="torsoRain" style="display:none">
          <path d="M29 112 Q28 78 50 73 Q72 78 71 112 Z" fill="#e2b640" />
          <circle cx="50" cy="88" r="1.3" fill="#b98f25" />
          <circle cx="50" cy="98" r="1.3" fill="#b98f25" />
        </g>
        <g id="torsoSnowExtra" style="display:none">
          <rect x="35" y="70" width="30" height="8" rx="4" fill="#b8463e" />
          <rect x="55" y="74" width="7" height="17" rx="3" fill="#b8463e" />
          <line x1="55" y1="81" x2="62" y2="81" stroke="#ede5d4" stroke-width="1.2" />
          <line x1="55" y1="86" x2="62" y2="86" stroke="#ede5d4" stroke-width="1.2" />
        </g>
        <g id="torsoStorm" style="display:none">
          <path d="M22 112 Q20 76 50 67 Q80 76 78 112 Q64 106 50 110 Q36 106 22 112 Z" fill="var(--body1)" stroke="var(--metal3)" stroke-width="0.8" />
          <line x1="37" y1="77" x2="35" y2="108" stroke="var(--metal1)" stroke-opacity="0.3" stroke-width="1" />
          <line x1="63" y1="77" x2="65" y2="108" stroke="var(--metal1)" stroke-opacity="0.3" stroke-width="1" />
          <path d="M24 94 Q50 88 76 94" stroke="var(--metal1)" stroke-opacity="0.3" stroke-width="1" fill="none" />
        </g>

        <g id="head">
          <circle id="raincoatHoodBack" cx="50" cy="49" r="27" fill="#e2b640" style="display:none" />
          <circle cx="27.5" cy="53" r="4.5" fill="#e8b98c" />
          <circle cx="72.5" cy="53" r="4.5" fill="#e8b98c" />
          <circle cx="50" cy="50" r="22.5" fill="#e8b98c" />
          <circle cx="37" cy="58" r="3.2" fill="#e8907c" opacity="0.45" />
          <circle cx="63" cy="58" r="3.2" fill="#e8907c" opacity="0.45" />
          <path d="M27.5 50 Q26 25 50 25 Q74 25 72.5 50 Q68 38 58 37 Q53 31 45 35 Q34 37 27.5 50 Z" fill="#3a2a20" />

          <g id="eyesOpen">
            <circle cx="42" cy="52" r="2.6" fill="var(--ink)" />
            <circle cx="58" cy="52" r="2.6" fill="var(--ink)" />
            <circle cx="42.9" cy="51.1" r="0.8" fill="#fff" />
            <circle cx="58.9" cy="51.1" r="0.8" fill="#fff" />
          </g>
          <g id="eyesClosed" style="display:none" stroke="#3a2a20" stroke-width="1.6" fill="none" stroke-linecap="round">
            <path d="M38.5 52 q3.5 3 7 0" />
            <path d="M54.5 52 q3.5 3 7 0" />
          </g>

          <path d="M46 62 q4 3 8 0" stroke="#3a2a20" stroke-width="1.3" fill="none" stroke-linecap="round" />

          <path id="raincoatHood" style="display:none" d="M24 52 Q22 20 50 20 Q78 20 76 52 Q72 34 50 32 Q28 34 24 52 Z" fill="#e2b640" stroke="#b98f25" stroke-width="0.8" />

          <g id="snowHat" style="display:none">
            <path d="M27 44 Q27 19 50 19 Q73 19 73 44 Z" fill="#b8463e" />
            <rect x="26" y="38" width="48" height="8" rx="4" fill="#ede5d4" />
            <circle cx="50" cy="17" r="5" fill="#ede5d4" />
          </g>

          <g id="sunglasses" style="display:none">
            <rect x="35" y="27" width="12" height="7" rx="3" fill="#1f1b1a" />
            <rect x="53" y="27" width="12" height="7" rx="3" fill="#1f1b1a" />
            <line x1="47" y1="30" x2="53" y2="30" stroke="#1f1b1a" stroke-width="1.5" />
            <line x1="37" y1="29" x2="40" y2="29" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round" />
          </g>
        </g>

        <path id="armL" d="M35 80 Q28 92 31 102" stroke="var(--sweater)" stroke-width="7" stroke-linecap="round" fill="none" />
        <circle cx="31" cy="102" r="4" fill="#e8b98c" />
        <path id="armR" d="M65 80 Q72 92 69 102" stroke="var(--sweater)" stroke-width="7" stroke-linecap="round" fill="none" />
        <circle cx="69" cy="102" r="4" fill="#e8b98c" />

        <g id="umbrellaHeld" style="display:none">
          <line x1="69" y1="100" x2="70" y2="20" stroke="var(--metal3)" stroke-width="1.6" stroke-linecap="round" />
          <path d="M69 102 q0 5 -4 5" stroke="var(--metal3)" stroke-width="1.6" fill="none" stroke-linecap="round" />
          <path d="M44 20 A26 17 0 0 1 96 20 A6.5 6.5 0 0 0 83 20 A6.5 6.5 0 0 0 70 20 A6.5 6.5 0 0 0 57 20 A6.5 6.5 0 0 0 44 20 Z" fill="var(--body1)" stroke="var(--metal3)" stroke-width="0.8" stroke-linejoin="round" />
          <path d="M70 3 Q62 9 57 20 M70 3 L70 20 M70 3 Q78 9 83 20" stroke="var(--metal3)" stroke-width="0.6" stroke-opacity="0.7" fill="none" />
          <line x1="70" y1="3" x2="70" y2="0" stroke="var(--metal3)" stroke-width="1.2" stroke-linecap="round" />
        </g>
      </svg>
    </div>

    <div id="info">
      <div id="temp">--°</div>
      <div id="place">…</div>
    </div>
  </div>

<script>
  // Dragging, double-click and right-click are all handled natively by a
  // separate, invisible WPF window the host places on top of the avatar —
  // this page itself is purely decorative and never receives mouse input.

  // ---- blink, purely decorative ----
  const eyesOpen = document.getElementById('eyesOpen');
  const eyesClosed = document.getElementById('eyesClosed');
  function scheduleBlink() {
    const wait = 2400 + Math.random() * 2800;
    setTimeout(() => {
      eyesOpen.style.display = 'none';
      eyesClosed.style.display = '';
      setTimeout(() => {
        eyesOpen.style.display = '';
        eyesClosed.style.display = 'none';
        scheduleBlink();
      }, 140);
    }, wait);
  }
  scheduleBlink();

  // ---- lightning flash, storm only ----
  function scheduleFlash() {
    const wait = 1800 + Math.random() * 3200;
    setTimeout(() => {
      const flash = document.getElementById('flash');
      if (document.body.classList.contains('sky-storm')) {
        flash.classList.remove('on');
        void flash.offsetWidth;
        flash.classList.add('on');
      }
      scheduleFlash();
    }, wait);
  }
  scheduleFlash();

  // ---- sun rays (drawn once) ----
  const sun = document.querySelector('.sun');
  for (let i = 0; i < 8; i++) {
    const ray = document.createElement('div');
    ray.className = 'ray';
    ray.style.transform = `rotate(${(360 / 8) * i}deg)`;
    sun.appendChild(ray);
  }

  // ---- weather state -> which parts of the keeper show ----
  const groups = ['torsoRain', 'torsoSnowExtra', 'torsoStorm', 'raincoatHoodBack', 'raincoatHood', 'snowHat', 'sunglasses', 'umbrellaHeld', 'umbrellaLeaning'];
  function show(id, on) { document.getElementById(id).style.display = on ? '' : 'none'; }

  function applyWeather(kind) {
    document.body.classList.remove('sky-clear', 'sky-cloudy', 'sky-rain', 'sky-snow', 'sky-storm');
    document.body.classList.add('sky-' + kind);
    groups.forEach((id) => show(id, false));

    const armColor =
      kind === 'rain' ? '#e2b640' : kind === 'storm' ? 'var(--body1)' : 'var(--sweater)';
    document.getElementById('armL').setAttribute('stroke', armColor);
    document.getElementById('armR').setAttribute('stroke', armColor);

    if (kind === 'rain') {
      show('torsoRain', true);
      show('raincoatHoodBack', true);
      show('raincoatHood', true);
      show('umbrellaHeld', true);
    } else if (kind === 'snow') {
      show('torsoSnowExtra', true);
      show('snowHat', true);
    } else if (kind === 'storm') {
      show('torsoStorm', true);
    } else if (kind === 'clear') {
      show('sunglasses', true);
    }
    // cloudy: default torso, no sunglasses (no direct sun) — just the cloud overhead
  }
  // ---- live weather, from the query string CloClo's WPF host supplies ----
  const params = new URLSearchParams(location.search);
  const lat = params.get('lat');
  const lon = params.get('lon');
  const place = params.get('city') || '';
  document.getElementById('place').textContent = place;

  // "auto" follows the real forecast below; anything else is a manual pick
  // from the right-click menu, which wins over whatever the forecast says —
  // the temperature and location still update live either way.
  const skyOverride = params.get('sky') || 'auto';
  if (skyOverride !== 'auto') applyWeather(skyOverride);
  else applyWeather('clear');

  function codeToSky(code) {
    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return 'rain';
    if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snow';
    if ([95, 96, 99].includes(code)) return 'storm';
    if ([2, 3, 45, 48].includes(code)) return 'cloudy'; // partly cloudy, overcast, fog
    return 'clear'; // 0 clear sky, 1 mainly clear
  }

  async function refreshWeather() {
    if (!lat || !lon) return;
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weather_code;
      document.getElementById('temp').textContent = `${temp}°`;
      if (skyOverride === 'auto') applyWeather(codeToSky(code));
    } catch (err) {
      document.getElementById('temp').textContent = '—°';
    }
  }
  refreshWeather();
  setInterval(refreshWeather, 20 * 60 * 1000);
</script>
</body>
</html>
